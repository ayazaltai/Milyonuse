# Local development stack. Mirrors the managed services (Neon Postgres with
# pgvector) closely enough that "works locally" means something.
name: milyonuse

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    # The container's superuser only bootstraps the cluster; on first start it
    # runs db/roles.sql and db/database.sql, so milyonuse owns the database as
    # an ordinary role bound by row-level security, as in production.
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports: ['5432:5432']
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
      - ./db/database.sql:/docker-entrypoint-initdb.d/02-database.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d milyonuse']
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches outbound mail locally (SMTP_URL=smtp://127.0.0.1:1025, UI on :8025).
  mail:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports: ['1025:1025', '8025:8025']

volumes:
  postgres-data:
